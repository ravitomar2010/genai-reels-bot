name: Daily Instagram Reel + YouTube Short

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST = 04:30 UTC
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf" \
               -O /usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf
          sudo wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf" \
               -O /usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf
          sudo wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf" \
               -O /usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf
          sudo fc-cache -f

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch post analytics (steers next topic selection)
        continue-on-error: true   # nice-to-have signal, never block the daily post if Zernio's analytics API errors
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python3 scripts/fetch_analytics.py

      - name: Generate AI content (with fallback to static topics)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/ai_content_generator.py \
            && echo "AI_CONTENT=ok" >> "$GITHUB_ENV" \
            || {
              echo "WARNING: AI content generator failed — falling back to static topic rotation"
              echo "AI_CONTENT=fallback" >> "$GITHUB_ENV"
              rm -f generated/ai_topic.json
            }

      - name: Verify fonts installed
        run: |
          echo "=== Checking Poppins fonts ==="
          ls -la /usr/share/fonts/truetype/google-fonts/ || echo "google-fonts dir missing"
          fc-list | grep -i poppins || echo "Poppins not in fc-list"
          python3 -c "from PIL import ImageFont; f=ImageFont.truetype('/usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf',100); print(f'Font loaded OK: {f.getlength(\"Test\")}px wide')" || echo "FONT LOAD FAILED"

      - name: Generate Reel video
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python3 scripts/generate_reel_v2.py

      - name: Generate presenter overlay (optional, off by default)
        continue-on-error: true   # a presenter failure must never break the daily reel
        env:
          PRESENTER_BACKEND: none   # flip manually to did/replicate/sync once ready — see docs/presenter.md
          PRESENTER_CHAR_REF: assets/character/presenter.png
          DID_API_KEY: ${{ secrets.DID_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}   # only used by the sync backend, to host inputs (Sync has no direct upload)
        run: python3 scripts/generate_presenter.py

      - name: Post to Instagram via Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python3 scripts/post_reel.py

      - name: Post to YouTube Shorts via Zernio
        continue-on-error: true   # don't block Instagram's tracker confirm if YouTube isn't connected yet / fails
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python3 scripts/post_youtube.py

      - name: Confirm post (update tracker only on success)
        run: python3 scripts/confirm_post.py

      - name: Save topic tracker + post history (commit back)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/topic_tracker.json scripts/post_history.json
          git diff --staged --quiet || git commit -m "chore: advance topic tracker + post history [skip ci]"
          git pull --rebase origin main
          git push
